[project]
name = "car-surveyor"
version = "0.1.0"
description = "Rebuilds a slice of the OpenSpec US vehicle catalogue from primary documents, then scores both against those documents."
readme = "README.md"
authors = [
    { name = "AhmedAyad89", email = "a.3ayad@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]   # I = isort, so no separate isort

[tool.ty.rules]

[tool.pytest.ini_options]
testpaths = ["tests"]
